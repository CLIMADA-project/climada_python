[build-system]
requires = ["setuptools >= 64", "setuptools_scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "climada"
version = "6.1.1-dev"
description = "Framework for climate risk assessment and adaptation option appraisal"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GNU General Public License v3 (GPLv3)" }
authors = [
    { name = "ETH", email = "climada-info@sympa.ethz.ch" }
]
keywords = ["climate", "adaptation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "bayesian-optimization<2",
    "bottleneck>=1.6.0",
    "cartopy>=0.25.0",
    "cfgrib>=0.9.15.1",
    "contextily>=1.7.0",
    "dask>=2026.3.0",
    "deprecation>=2.1.0",
    "eccodeslib>=2.47.1.20",  # See https://github.com/ecmwf/eccodes-python/issues/150
    "fiona>=1.10.1",
    "geopandas>=1.1.3",
    "h5py>=3.16.0",
    "haversine>=2.9.0",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.3",
    "numba>=0.65.1",
    "openpyxl>=3.1.5",
    "overpy>=0.7",
    "pandas>=2.3.3,<3.0",
    "pathos>=0.3.5",
    "peewee>=4.0.5",
    "pillow>=12.2.0",
    "pint>=0.24.4",
    "pyarrow>=24.0.0",
    "pycountry>=26.2.16",
    "pyproj>=3.7.1",
    "rasterio>=1.4.4",
    "salib>=1.5.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sparse>=0.17.0",
    "statsmodels>=0.14.6",
    "tables>=3.10.1",
    "tabulate>=0.10.0",
    "tqdm>=4.67.3",
    "xarray>=2025.6.1",
    "xlrd>=2.0.2",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "doc"}
]
test = [
    {include-group = "interactive"},
    "mccabe>=0.7.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-subtests>=0.15.0",
]
doc = [
    {include-group = "interactive"},
    "myst-nb>=1.4.0",
    "readthedocs-sphinx-ext>=2.2.5",
    "sphinx<9.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-design>=0.6.1",
    "sphinx-markdown-tables>=0.0.17",
    "sphinx-mdinclude>=0.6.2",
]
interactive = [
    "ipython>=8.39.0",
]

[project.urls]
Homepage = "https://github.com/CLIMADA-project/climada_python"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["climada*"]
