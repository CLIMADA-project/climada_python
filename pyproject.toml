[build-system]
requires = ["setuptools >= 64", "setuptools_scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "climada"
version = "6.2.1-dev"
description = "Framework for climate risk assessment and adaptation option appraisal"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GNU General Public License v3 (GPLv3)" }
authors = [
    { name = "ETH", email = "climada-info@sympa.ethz.ch" }
]
keywords = ["climate", "adaptation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "affine<3.0",
    "bayesian-optimization<2",
    "bottleneck>=1.6.0",
    "cartopy>=0.25.0",
    "cfgrib>=0.9",
    "contextily>=1.7.0",
    "dask>=2026.8",
    "deprecation>=2.1.0",
    "eccodes>=2.47.0",
    "eccodeslib>=2.47.0",
    "fiona>=1.10",
    "geopandas>=1.1",
    "h5py>=3.16.0",
    "haversine>=2.9.0",
    "matplotlib>=3.10,<3.11",
    "netcdf4>=1.7",
    "numba>=0.67",
    "openpyxl>=3.1",
    "pandas>=2.2,<2.3",
    "pathos>=0.3",
    "peewee>=4.4",
    "pillow>=12.2.0",
    "pint>=0.25",
    "pyarrow>=24,<26",  # See https://github.com/apache/arrow/issues/55467
    "pycountry>=24.6",
    "pyproj>=3.7",
    "rasterio>=1.4,<1.5",
    "salib>=1.5.2",
    "scikit-learn>=1.9",
    "scipy>=1.17",
    "seaborn>=0.13",
    "sparse>=0.19",
    "statsmodels>=0.15",
    "tables>=3.11",
    "tabulate>=0.10.0",
    "tqdm>=4.70",
    "xarray>=2026.7",
    "xlrd>=2.0",
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "doc"}
]
test = [
    {include-group = "interactive"},
    "mccabe>=0.7.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-subtests>=0.15.0",
]
doc = [
    {include-group = "interactive"},
    "myst-nb>=1.4.0",
    "sphinx<9.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-design>=0.6.1",
    "sphinx-markdown-tables>=0.0.17",
    "sphinx-mdinclude>=0.6.2",
]
interactive = [
    "ipython>=8.39.0",
]

[project.urls]
Homepage = "https://github.com/CLIMADA-project/climada_python"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["climada*"]
