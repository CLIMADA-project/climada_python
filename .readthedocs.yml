version: 2

sphinx:
  configuration: doc/conf.py

build:
  os: "ubuntu-22.04"
  tools:
    python: "mambaforge-4.10"

  # Pin Python version in requirements
  jobs:
    pre_create_environment:
      - sed -i 's/^  - python[<>=].*/  - python=3.12/' requirements/env_climada.yml

conda:
  environment: requirements/env_climada.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc

formats:
  - pdf
