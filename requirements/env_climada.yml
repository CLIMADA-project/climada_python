name: climada_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - affine>=2.4,<3.0  # see #1311, affine 3.0 cannot read metadata from hdf5 files written by climada < 6.1
  - bayesian-optimization>=1.5,<2.0
  - bottleneck>=1.6
  - cartopy>=0.26
  - cfgrib>=0.9
  - contextily>=1.7
  - dask>=2026.8
  - deprecation>=2.1
  - eccodes>=2.47
  - fiona>=1.10
  - gdal>=3.12
  - geopandas>=1.2
  - h5py>=3.16
  - haversine>=2.9
  - matplotlib-base>=3.10,<3.11  # see #1298, https://github.com/matplotlib/matplotlib/issues/31926
  - netcdf4>=1.7
  - numba>=0.68
  - numexpr>=2.14
  - openpyxl>=3.1
  - osm-flex>=1.1  # this is only required for running the tutorials, not for the CLIMADA package itself
  # petals requires pandas < 3.0 for python >=3.11
  # petals requires pandas < 2.3 for python >=3.12 (https://github.com/IndEcol/pymrio/issues/177)
  - pandas>=2.2,<2.3
  - pathos>=0.3
  - peewee>=4.5
  - pint>=0.25
  - pip
  - pyarrow>=24.0
  - pycountry>=26.2
  - pyproj>=3.7
  - pytables>=3.11  # this is the name of the pypi 'tables' package on conda-forge
  - pyxlsb>=1.0
  - rasterio>=1.4,<1.5  # 1.4 compatible with python 3.11; discrepancies between 1.4 and 1.5, see #1316
  - requests>=2.34
  - rtree>=1.4
  - salib>=1.6.0
  - scikit-learn>=1.9
  - scipy>=1.17
  - seaborn>=0.13
  - sparse>=0.19
  - statsmodels>=0.15
  - tabulate>=0.10
  - tqdm>=4.70
  - unittest-xml-reporting>=3.2
  - xarray>=2026.9
  - xlrd>=2.0
  - xlsxwriter>=3.2
